[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-tx-saver"
version = "0.2.1"
description = "Lossless Zstandard and delta transport for Claude Code uploads"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "claude-tx-saver contributors"}]
dependencies = ["aiohttp>=3.14.5,<4", "zstandard>=0.25,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Repository = "https://github.com/mohsenyz/claude-tx-saver"
Issues = "https://github.com/mohsenyz/claude-tx-saver/issues"

[project.scripts]
claude-tx-saver = "proxy:main"

[tool.setuptools]
py-modules = ["proxy", "wire", "tx_config"]
