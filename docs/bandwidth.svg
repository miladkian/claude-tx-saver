<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Bandwidth comparison</title><desc id="desc">A full Claude Code request used 298.5 kilobytes and a delta request used 8.85 kilobytes, a 97.04 percent reduction.</desc><rect width="900" height="300" rx="20" fill="#f5f8fa"/><text x="45" y="52" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">One 100k-context Claude Code request</text><text x="45" y="80" fill="#506575" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Measured upload body, live through the VPS</text><text x="45" y="135" fill="#314b5d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Full request</text><rect x="185" y="115" width="650" height="32" rx="8" fill="#d5e0e7"/><text x="850" y="138" text-anchor="end" fill="#314b5d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">298.5 KB</text><text x="45" y="205" fill="#314b5d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Delta + Zstd</text><rect x="185" y="185" width="19" height="32" rx="8" fill="#1d9d83"/><text x="850" y="208" text-anchor="end" fill="#1d806d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">8.85 KB · 97.04% saved</text><text x="45" y="260" fill="#506575" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Anthropic still receives the full context; token accounting is unchanged.</text></svg>
