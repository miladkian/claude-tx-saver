<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Claude TX Saver architecture</title>
  <desc id="desc">Claude Code sends a full request to a local client. The client sends compressed changed chunks over HTTPS to a VPS relay. The relay rebuilds the exact request and forwards it to Anthropic.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
    <linearGradient id="blue" x2="1"><stop stop-color="#55b7ff"/><stop offset="1" stop-color="#8be2c8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#050a11" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8be2c8"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700">Same Claude request. Smaller trip.</text>
  <text x="60" y="91" fill="#a9c2d4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">The relay is an opaque, authenticated HTTPS hop; Anthropic still receives the original request.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="150" width="235" height="150" rx="16" fill="#20354a" stroke="#3b6682"/>
    <rect x="482" y="150" width="235" height="150" rx="16" fill="#20354a" stroke="#3b6682"/>
    <rect x="910" y="150" width="235" height="150" rx="16" fill="#20354a" stroke="#3b6682"/>
  </g>
  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="82" y="190" font-size="18" font-weight="700">Claude Code</text><text x="82" y="216" fill="#a9c2d4" font-size="14">Your normal CLI</text><text x="82" y="258" fill="#8be2c8" font-size="14">full request</text><text x="82" y="282" fill="#7e9bb0" font-size="13">localhost:8787</text>
    <text x="509" y="190" font-size="18" font-weight="700">Your client proxy</text><text x="509" y="216" fill="#a9c2d4" font-size="14">content-defined chunks</text><text x="509" y="258" fill="#8be2c8" font-size="14">Zstandard + delta</text><text x="509" y="282" fill="#7e9bb0" font-size="13">authenticated HTTPS</text>
    <text x="937" y="190" font-size="18" font-weight="700">Your VPS relay</text><text x="937" y="216" fill="#a9c2d4" font-size="14">rebuilds exact bytes</text><text x="937" y="258" fill="#8be2c8" font-size="14">normal Anthropic API</text><text x="937" y="282" fill="#7e9bb0" font-size="13">api.anthropic.com</text>
  </g>
  <path d="M295 225h175" stroke="url(#blue)" stroke-width="4" marker-end="url(#arrow)"/><path d="M722 225h175" stroke="url(#blue)" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" text-anchor="middle"><text x="382" y="205" fill="#b9d7e8">full → changes</text><text x="810" y="205" fill="#b9d7e8">full request</text></g>
  <rect x="55" y="350" width="1090" height="2" fill="#31516a"/><text x="60" y="383" fill="#8be2c8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">97.04% less upload in live 100k-context testing</text><text x="1140" y="383" text-anchor="end" fill="#a9c2d4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">No SSH tunnel · no domain · no paid certificate</text>
</svg>
