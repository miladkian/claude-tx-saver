name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - name: Check installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: claude-tx-saver --help
      - name: Check installer syntax
        run: sh -n install.sh client.sh claude-via-proxy.sh
