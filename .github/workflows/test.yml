name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo build --release
      - run: target/release/claude-tx-saver --help
      - run: docker build -t claude-tx-saver:test .
